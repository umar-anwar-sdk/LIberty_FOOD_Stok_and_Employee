{% extends "base.html" %}
{% block title %}Edit Category · Liberty Food{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
  <a href="{% url 'category_list' %}" class="mb-4 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Categories</a>
  <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-slate-800 dark:bg-slate-900">
    <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-800"><h1 class="text-xl font-extrabold text-slate-950 dark:text-white">Edit category</h1><p class="mt-1 text-sm text-slate-500">Update the category label used across the catalog.</p></div>
    <form method="POST" class="space-y-6 p-6">
      {% csrf_token %}
      <div><label for="name" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Category name</label><input type="text" id="name" name="name" value="{{ category.name }}" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-white"></div>
      <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-6 dark:border-slate-800 sm:flex-row sm:justify-end"><a href="{% url 'category_list' %}" class="inline-flex justify-center rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200">Cancel</a><button type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 hover:bg-indigo-700">Save changes</button></div>
    </form>
  </section>
</div>
{% endblock %}
