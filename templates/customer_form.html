{% extends "base.html" %}
{% block title %}Add Customer · Liberty Food{% endblock %}
{% block content %}
<div class="mx-auto max-w-4xl">
  <a href="{% url 'customer_list' %}" class="mb-4 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Customers</a>
  <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-slate-800 dark:bg-slate-900">
    <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-800"><p class="text-xs font-semibold uppercase tracking-[.18em] text-indigo-600 dark:text-indigo-400">Customer directory</p><h1 class="mt-2 text-xl font-extrabold text-slate-950 dark:text-white">Add customer</h1><p class="mt-1 text-sm text-slate-500">Create a customer profile for orders, payment tracking and portal access.</p></div>
    <form method="post" class="p-6 sm:p-8">{% csrf_token %}
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label for="customer-name" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Full name</label><input id="customer-name" type="text" name="name" placeholder="Customer name" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"></div>
        <div><label for="customer-email" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Email</label><input id="customer-email" type="email" name="email" placeholder="customer@example.com" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"></div>
        <div><label for="customer-phone" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Phone</label><input id="customer-phone" type="number" name="phone" placeholder="Phone number" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"></div>
        <div class="sm:col-span-2"><label for="customer-address" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Address</label><textarea id="customer-address" name="address" rows="4" placeholder="Complete customer address" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"></textarea></div>
      </div>
      <div class="mt-7 flex flex-col-reverse gap-3 border-t border-slate-100 pt-6 dark:border-slate-800 sm:flex-row sm:justify-end"><a href="{% url 'customer_list' %}" class="inline-flex justify-center rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-700 dark:border-slate-700 dark:text-slate-200">Cancel</a><button type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 hover:bg-indigo-700">Save customer</button></div>
    </form>
  </section>
</div>
{% endblock %}
