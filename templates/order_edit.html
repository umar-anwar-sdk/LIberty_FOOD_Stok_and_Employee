{% extends "base.html" %}
{% block title %}Edit Order · Liberty Food{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl"><a href="{% url 'order_list' %}" class="mb-4 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-indigo-600"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Orders</a><section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-slate-800 dark:bg-slate-900"><div class="border-b border-slate-200 px-6 py-5 dark:border-slate-800"><span class="font-mono text-xs font-semibold text-indigo-600 dark:text-indigo-400">ORDER #{{ order.id }}</span><h1 class="mt-2 text-xl font-extrabold text-slate-950 dark:text-white">Edit order</h1><p class="mt-1 text-sm text-slate-500">Update customer, product and quantity details.</p></div><form method="post" class="space-y-5 p-6">{% csrf_token %}<input type="hidden" name="order_id" value="{{ order.id }}"><div><label class="mb-2 block text-sm font-semibold">Customer</label><select name="customer" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"><option value="">Select customer</option>{% for c in customers %}<option value="{{ c.id }}" {% if order.customer and c.id == order.customer.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div><label class="mb-2 block text-sm font-semibold">Food item</label><select name="food_item" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"><option value="">Select food item</option>{% for f in food_items %}<option value="{{ f.id }}" {% if f.id == order.food_item.id %}selected{% endif %}>{{ f.name }} (Rs. {{ f.price }})</option>{% endfor %}</select></div><div><label class="mb-2 block text-sm font-semibold">Quantity</label><input type="number" name="quantity" value="{{ order.quantity }}" min="1" required class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"></div><div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-6 dark:border-slate-800 sm:flex-row sm:justify-end"><a href="{% url 'order_list' %}" class="rounded-xl border border-slate-300 px-5 py-2.5 text-center text-sm font-semibold dark:border-slate-700">Cancel</a><button type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white">Update order</button></div></form></section></div>
{% endblock %}
