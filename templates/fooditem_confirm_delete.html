{% extends "base.html" %}
{% block title %}Delete {{ item.name }} · Liberty Food{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl py-8"><section class="rounded-2xl border border-red-200 bg-white p-7 text-center shadow-soft dark:border-red-900 dark:bg-slate-900"><h1 class="mt-5 text-xl font-extrabold text-slate-950 dark:text-white">Delete food item?</h1><p class="mt-2 text-sm leading-6 text-slate-500">You are about to permanently delete <strong>{{ item.name }}</strong>.</p><form method="post" class="mt-7 space-y-3">{% csrf_token %}<textarea required name="delete_reason" rows="3" placeholder="Delete reason" class="w-full rounded-xl border p-3 text-left"></textarea><div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-center"><a href="{% url 'fooditem_list' %}" class="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold">Cancel</a><button type="submit" class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-semibold text-white">Yes, delete item</button></div></form></section></div>
{% endblock %}
