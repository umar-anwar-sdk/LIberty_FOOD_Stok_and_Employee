{% extends "base.html" %}
{% block title %}Delete {{ item.name }} · Liberty Food{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl py-8"><section class="rounded-2xl border border-red-200 bg-white p-7 text-center shadow-soft dark:border-red-900 dark:bg-slate-900"><span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-red-50 text-red-600 dark:bg-red-950/50 dark:text-red-400"><svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></span><h1 class="mt-5 text-xl font-extrabold text-slate-950 dark:text-white">Delete food item?</h1><p class="mt-2 text-sm leading-6 text-slate-500">You are about to permanently delete <strong class="text-slate-800 dark:text-slate-200">{{ item.name }}</strong>. This action cannot be undone.</p><form method="post" class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">{% csrf_token %}<a href="{% url 'fooditem_list' %}" class="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-700 dark:border-slate-700 dark:text-slate-200">Cancel</a><button type="submit" class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-red-600/20 hover:bg-red-700">Yes, delete item</button></form></section></div>
{% endblock %}
